<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Marketing Role Finder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Shippori+Mincho+B1:wght@700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow phone-first column; sticky header with progress + step tabs; each step is a stack of question cards. Indigo ink on cool paper, four role hues. */
:root {
  --paper: #F4F6F9;
  --card: #FFFFFF;
  --ink: #1A2340;
  --muted: #586179;
  --line: #DCE1EA;
  --accent: #2D4A8A;
  --accent-soft: #E6ECF8;
  --on-accent: #FFFFFF;
  --sns: #B0406F;
  --ads: #A86A12;
  --content: #2C7458;
  --analytics: #2A6F8F;
  --good: #2C7458;
  --font-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F1320; --card: #171C2B; --ink: #E6E9F2; --muted: #9AA3BA; --line: #2A3146;
    --accent: #93AAE6; --accent-soft: #1F2A45; --on-accent: #0F1320;
    --sns: #E58AB2; --ads: #E2B35C; --content: #6CC7A0; --analytics: #6FB9DB; --good: #6CC7A0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F1320; --card: #171C2B; --ink: #E6E9F2; --muted: #9AA3BA; --line: #2A3146;
  --accent: #93AAE6; --accent-soft: #1F2A45; --on-accent: #0F1320;
  --sns: #E58AB2; --ads: #E2B35C; --content: #6CC7A0; --analytics: #6FB9DB; --good: #6CC7A0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.7;
  -webkit-text-size-adjust: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); }
header.top .wrap { padding-block: 12px 0; display: grid; gap: 10px; }
.home-link { font-size: 13px; color: var(--muted); text-decoration: none; }
.home-link:hover { color: var(--accent); }
.titlerow { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-size: 17px; line-height: 1.3; text-wrap: balance; min-width: 0; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; flex-shrink: 0; background: var(--card); }
.lang button { border: 0; background: none; color: var(--muted); font: 500 13px var(--font-body); padding: 6px 12px; border-radius: 999px; cursor: pointer; min-height: 32px; }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); transition: width .3s ease; }
.meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.meta .num { font-family: var(--font-num); }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin-inline: -4px; padding-inline: 4px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex-shrink: 0; border: 0; background: none; color: var(--muted); font: 500 14px var(--font-body); padding: 8px 10px 10px; border-bottom: 2px solid transparent; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; }
.tabs button[aria-current="step"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs .done { width: 16px; height: 16px; border-radius: 50%; background: var(--good); color: var(--card); display: inline-grid; place-items: center; font-size: 10px; line-height: 1; }

main .wrap { padding-block: 24px 64px; display: grid; gap: 20px; }
h1, h2 { font-family: var(--font-display); font-weight: 700; line-height: 1.35; text-wrap: balance; margin: 0; }
h1 { font-size: 26px; }
h2 { font-size: 20px; }
h3 { font-size: 16px; font-weight: 700; margin: 0; line-height: 1.5; }
p { margin: 0; }
.lede { color: var(--muted); }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.stack { display: grid; gap: 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 14px; min-width: 0; }
.note { font-size: 14px; color: var(--muted); padding: 12px 14px; border-radius: 10px; background: var(--accent-soft); }

.roles { display: grid; gap: 10px; }
.role { display: grid; grid-template-columns: 10px 1fr; gap: 12px; align-items: start; }
.role .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 8px; }
.role b { display: block; }
.role span { color: var(--muted); font-size: 14px; }
.c-sns { background: var(--sns); } .c-ads { background: var(--ads); } .c-content { background: var(--content); } .c-analytics { background: var(--analytics); }

fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
legend { padding: 0; font-weight: 700; line-height: 1.55; margin-bottom: 12px; display: flex; gap: 10px; }
legend .qn { font-family: var(--font-num); color: var(--muted); font-weight: 500; flex-shrink: 0; }
.opts { display: grid; gap: 8px; }
.opt { position: relative; display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; min-height: 48px; line-height: 1.55; }
.opt input, .pick input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.opt .letter { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-family: var(--font-num); font-size: 12px; color: var(--muted); margin-top: -1px; }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opt:has(input:checked) .letter { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.opt:has(input:focus-visible), .pick:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.card.answered { border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }

.task-head { display: flex; align-items: center; gap: 10px; }
.chip { font-size: 12px; font-weight: 500; padding: 2px 10px; border-radius: 999px; color: var(--card); flex-shrink: 0; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 500; font-size: 13px; }
td.n, th.n { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
ol.sub { margin: 0; padding-left: 1.4em; display: grid; gap: 4px; }
label.field { display: grid; gap: 6px; font-weight: 500; font-size: 14px; }
label.field small { font-weight: 400; color: var(--muted); }
textarea { width: 100%; min-height: 110px; resize: vertical; font: 16px/1.6 var(--font-body); color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
textarea:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.rate { display: grid; gap: 14px; padding-top: 4px; border-top: 1px dashed var(--line); }
.rate .q { font-size: 14px; font-weight: 500; margin-bottom: 6px; }
.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.scale.two { grid-template-columns: repeat(2, 1fr); }
.pick { position: relative; display: grid; place-items: center; min-height: 44px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; font-family: var(--font-num); font-size: 15px; background: var(--card); }
.scale.two .pick { font-family: var(--font-body); }
.pick:has(input:checked) { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 4px; }

.btnrow { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: 500 15px var(--font-body); padding: 11px 18px; border-radius: 10px; min-height: 46px; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.danger { color: #B42318; border-color: color-mix(in srgb, #B42318 40%, var(--line)); }
:root[data-theme="dark"] .btn.danger { color: #F49A90; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.danger { color: #F49A90; } }
.btn:disabled { opacity: .5; cursor: default; }
.navrow { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.navrow .btn.primary { margin-left: auto; }
.status { font-size: 14px; color: var(--good); min-height: 1.4em; }
.status.err { color: var(--muted); }

.top-role { border-width: 2px; }
.top-role .name { font-family: var(--font-display); font-size: 24px; line-height: 1.3; }
.scores { display: grid; gap: 12px; }
.score { display: grid; gap: 4px; }
.score .row { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.score .row .num { font-family: var(--font-num); font-variant-numeric: tabular-nums; color: var(--muted); }
.track { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; }
.track > i { display: block; height: 100%; border-radius: 5px; }
.kv { display: grid; gap: 2px; }
.kv .k { font-size: 12px; letter-spacing: .06em; color: var(--muted); font-weight: 500; }
.missing { margin: 0; padding-left: 1.2em; }
.missing button { border: 0; background: none; color: var(--accent); font: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 0; }
.summary-out { font-size: 13px; min-height: 160px; }
.filelabel { position: relative; overflow: hidden; display: inline-grid; place-items: center; }
.filelabel input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.confirm { display: grid; gap: 10px; padding: 14px; border: 1px solid var(--line); border-radius: 10px; }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>
</head>

const STORE_KEY = 'marketing-role-finder-v1';
const fresh = lang => ({ v: 1, lang, step: 0, answers: Array(12).fill(null), tasks: [0, 1, 2, 3].map(() => ({ text: '', enjoy: null, ease: null, more: null })), reflect: ['', '', '', '', ''], notes: '', updated: null });
let canStore = true;
let savedAt = null;

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return normalize(JSON.parse(raw));
  } catch (e) { canStore = false; }
  const nav = (navigator.language || '').toLowerCase();
  return fresh(nav.startsWith('ja') ? 'ja' : 'en');
}
function normalize(o) {
  if (!o || typeof o !== 'object' || !Array.isArray(o.answers) || !Array.isArray(o.tasks)) throw new Error('bad');
  const s = fresh(o.lang === 'ja' ? 'ja' : 'en');
  s.step = Number.isInteger(o.step) && o.step >= 0 && o.step < 6 ? o.step : 0;
  s.answers = s.answers.map((_, i) => [0, 1, 2, 3].includes(o.answers[i]) ? o.answers[i] : null);
  s.tasks = s.tasks.map((t, i) => {
    const x = o.tasks[i] || {};
    return { text: typeof x.text === 'string' ? x.text : '', enjoy: [1, 2, 3, 4, 5].includes(x.enjoy) ? x.enjoy : null, ease: [1, 2, 3, 4, 5].includes(x.ease) ? x.ease : null, more: x.more === 'yes' || x.more === 'no' ? x.more : null };
  });
  s.reflect = s.reflect.map((_, i) => typeof (o.reflect || [])[i] === 'string' ? o.reflect[i] : '');
  s.notes = typeof o.notes === 'string' ? o.notes : '';
  s.updated = o.updated || null;
  return s;
}
let S = load();
// ?lang=ja or ?lang=en (from the guide pages) picks the language.
{
  const q = new URLSearchParams(location.search).get('lang');
  if (q === 'ja' || q === 'en') S.lang = q;
  try { localStorage.setItem('mcg:lang', S.lang); } catch (e) {}
}
let saveTimer = null;
function persist() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    S.updated = new Date().toISOString();
    try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); savedAt = new Date(); canStore = true; }
    catch (e) { canStore = false; }
    paintMeta();
  }, 250);
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const L = () => T[S.lang];
const answeredQ = () => S.answers.filter(a => a !== null).length;
const ratedT = () => S.tasks.filter(t => t.enjoy && t.ease && t.more).length;
const reflected = () => S.reflect.filter(r => r.trim()).length;
function percent() { return Math.round((answeredQ() + ratedT() * 3 + reflected()) / (12 + 12 + 5) * 100); }
const stepDone = [() => false, () => answeredQ() === 12, () => ratedT() === 4, () => answeredQ() === 12 && ratedT() === 4, () => reflected() === 5, () => false];

function scores() {
  return ROLES.map(role => {
    const q = S.answers.reduce((n, a, i) => n + (a !== null && KEY[i][a] === role ? 1 : 0), 0);
    const t = S.tasks[TASK_ROLE.indexOf(role)];
    const e = t.enjoy || 0, b = t.more === 'yes' ? 3 : 0;
    return { role, q, e, b, total: q + e + b, ease: t.ease || 0 };
  }).sort((x, y) => y.total - x.total || y.ease - x.ease);
}

function paintMeta() {
  const l = L();
  const hl = document.getElementById('home-link');
  if (hl) { hl.href = S.lang === 'ja' ? '../ja/' : '../'; hl.textContent = S.lang === 'ja' ? '← マーケティング・キャリアガイド' : '← Marketing Career Guide'; }
  document.documentElement.lang = S.lang;
  document.getElementById('brand').textContent = l.brand;
  const p = percent();
  document.getElementById('bar').style.width = p + '%';
  document.getElementById('pct').textContent = l.pct(p);
  const ss = document.getElementById('savestate');
  ss.textContent = !canStore ? l.notSaving : savedAt ? l.saved(savedAt.toLocaleTimeString(S.lang === 'ja' ? 'ja-JP' : 'en-US', { hour: 'numeric', minute: '2-digit' })) : '';
  document.getElementById('lang-en').setAttribute('aria-pressed', S.lang === 'en');
  document.getElementById('lang-ja').setAttribute('aria-pressed', S.lang === 'ja');
  document.getElementById('tabs').innerHTML = l.tabs.map((name, i) =>
    `<button type="button" data-step="${i}" ${i === S.step ? 'aria-current="step"' : ''}>${esc(name)}${stepDone[i]() ? '<span class="done" aria-hidden="true">✓</span>' : ''}</button>`).join('');
  const qc = document.getElementById('qcount'); if (qc) qc.textContent = l.q.count(answeredQ());
  const tc = document.getElementById('tcount'); if (tc) tc.textContent = l.t.count(ratedT());
}

}

    <section class="card"><h2>${esc(l.start.rolesH)}</h2><div class="roles">${ROLES.map(r => `<div class="role"><span class="dot c-${r}"></span><div><b>${esc(l.roles[r].name)}${l.roles[r].jp ? ` <span>${esc(l.roles[r].jp)}</span>` : ''}</b><span>${esc(l.roles[r].line)}</span></div></div>`).join('')}</div></section>
    <p class="note">${esc(l.start.save)}</p>
    <div class="navrow"><button type="button" class="btn primary" data-go="1">${esc(l.start.go)}</button></div>`;
  },
  function questions() {
    const l = L();
    return `<div class="stack"><h1>${esc(l.q.h)}</h1><p class="lede">${esc(l.q.p)}</p><p class="eyebrow" id="qcount">${esc(l.q.count(answeredQ()))}</p></div>
    ${l.q.items.map(([q, opts], i) => `<fieldset class="card${S.answers[i] !== null ? ' answered' : ''}" id="card-q${i}"><legend><span class="qn">${String(i + 1).padStart(2, '0')}</span><span>${esc(q)}</span></legend><div class="opts">${opts.map((o, k) =>
      `<label class="opt" for="q${i}-${k}"><input type="radio" name="q${i}" id="q${i}-${k}" value="${k}" data-kind="answer" data-i="${i}" ${S.answers[i] === k ? 'checked' : ''}><span class="letter">${LETTERS[k]}</span><span>${esc(o)}</span></label>`).join('')}</div></fieldset>`).join('')}
    ${nav(true, l.q.next)}`;
  },
  function tasks() {
    const l = L(), t = l.t;
    const table = kind => {
      if (kind === 'channels') return `<div class="tablewrap"><table><thead><tr><th>${esc(t.cols[0])}</th><th class="n">${esc(t.cols[1])}</th><th class="n">${esc(t.cols[2])}</th></tr></thead><tbody>${CHANNEL_DATA.map((r, i) => `<tr><td>${esc(t.channels[i])}</td><td class="n">${r[0].toLocaleString('en-US')}</td><td class="n">${r[1]}</td></tr>`).join('')}</tbody></table></div>`;
      return `<div class="tablewrap"><table><thead><tr><th>${esc(t.wcols[0])}</th><th class="n">${esc(t.wcols[1])}</th><th class="n">${esc(t.wcols[2])}</th></tr></thead><tbody>${WEEK_DATA.map((r, i) => `<tr><td>${esc(t.week(i + 1))}</td><td class="n">${r[0].toLocaleString('en-US')}</td><td class="n">${r[1]}</td></tr>`).join('')}</tbody></table></div>`;
    };
    const scale = (i, field, label) => `<div><div class="q" id="lab-${field}-${i}">${esc(label)}</div><div class="scale" role="radiogroup" aria-labelledby="lab-${field}-${i}">${[1, 2, 3, 4, 5].map(v => `<label class="pick" for="${field}-${i}-${v}"><input type="radio" name="${field}-${i}" id="${field}-${i}-${v}" value="${v}" data-kind="${field}" data-i="${i}" ${S.tasks[i][field] === v ? 'checked' : ''}>${v}</label>`).join('')}</div><div class="ends"><span>${esc(t.lo)}</span><span>${esc(t.hi)}</span></div></div>`;
    return `<div class="stack"><h1>${esc(t.h)}</h1><p class="lede">${esc(t.p)}</p><p class="note">${esc(t.scene)}</p><p class="eyebrow" id="tcount">${esc(t.count(ratedT()))}</p></div>
    ${t.tasks.map((task, i) => {
      const role = TASK_ROLE[i];
      return `<section class="card" id="card-t${i}"><div class="task-head"><span class="chip c-${role}">${esc(l.roles[role].name)}</span><span class="eyebrow">${S.lang === 'ja' ? `タスク${i + 1}` : `Task ${i + 1}`}</span></div><h2>${esc(task.title)}</h2>
      ${task.body.map(b => `<p>${esc(b)}</p>`).join('')}${task.table ? table(task.table) : ''}${task.steps ? `<ol class="sub">${task.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>` : ''}
      <label class="field" for="text-${i}">${esc(t.work)} <small>${esc(t.workHint)}</small><textarea id="text-${i}" data-kind="text" data-i="${i}">${esc(S.tasks[i].text)}</textarea></label>
      <div class="rate"><h3>${esc(t.rateH)}</h3>${scale(i, 'enjoy', t.enjoy)}${scale(i, 'ease', t.ease)}
      <div><div class="q" id="lab-more-${i}">${esc(t.more)}</div><div class="scale two" role="radiogroup" aria-labelledby="lab-more-${i}">${['yes', 'no'].map(v => `<label class="pick" for="more-${i}-${v}"><input type="radio" name="more-${i}" id="more-${i}-${v}" value="${v}" data-kind="more" data-i="${i}" ${S.tasks[i].more === v ? 'checked' : ''}>${esc(t[v])}</label>`).join('')}</div></div></div></section>`;
    }).join('')}
    ${nav(true, t.next)}`;
  },
  function results() {
    const l = L(), r = l.r;
    const mq = 12 - answeredQ(), mt = 4 - ratedT();
    if (mq || mt) {
      return `<div class="stack"><h1>${esc(r.h)}</h1><p class="lede">${esc(r.wait)}</p></div>
      <section class="card"><ul class="missing">${mq ? `<li><button type="button" data-go="1">${esc(r.missQ(mq))}</button></li>` : ''}${mt ? `<li><button type="button" data-go="2">${esc(r.missT(mt))}</button></li>` : ''}</ul></section>
      ${nav(true, null)}`;
    }
    const sc = scores(), top = sc[0], second = sc[1];
    const tied = top.total === second.total;
    const close = second.total >= top.total - 2;
    const pairKey = [top.role, second.role].sort().join('+');
    const combo = r.combos[pairKey] || r.combos.other;
    const R = l.roles[top.role];
    return `<div class="stack"><h1>${esc(r.h)}</h1></div>
    <section class="card top-role" style="border-color: var(--${top.role})"><span class="eyebrow">${esc(r.top)}</span><div class="name">${esc(R.name)}${R.jp ? ` <span class="lede" style="font-size:16px">${esc(R.jp)}</span>` : ''}</div><p>${esc(R.line)}</p>
      <div class="kv"><span class="k">${esc(r.enjoyK)}</span><span>${esc(R.enjoy)}</span></div>
      <div class="kv"><span class="k">${esc(r.firstK)}</span><span>${esc(R.first)}</span></div>
      <p class="lede" style="font-size:14px">${esc(r.note)}</p></section>
    <section class="card"><h2>${esc(r.scoresH)}</h2><p class="lede" style="font-size:14px">${esc(r.key)}</p>
      <div class="scores">${sc.map(s => `<div class="score"><div class="row"><b>${esc(l.roles[s.role].name)}</b><span class="num">${s.q} + ${s.e} + ${s.b} = <b style="color:var(--ink)">${s.total}</b></span></div><div class="track" role="img" aria-label="${esc(l.roles[s.role].name)}: ${s.total} / 20"><i class="c-${s.role}" style="width:${s.total / 20 * 100}%"></i></div></div>`).join('')}</div>
      ${tied ? `<p class="lede" style="font-size:14px">${esc(r.tie)}</p>` : ''}</section>
    ${close ? `<section class="card"><h2>${esc(r.closeH)}</h2><p>${esc(combo)}</p></section>` : ''}
    <section class="card"><h2>${esc(r.othersH)}</h2><div class="roles">${sc.slice(1).map(s => `<div class="role"><span class="dot c-${s.role}"></span><div><b>${esc(l.roles[s.role].name)}</b><span>${esc(l.roles[s.role].first)}</span></div></div>`).join('')}</div></section>
    <section class="card"><h2>${esc(r.checkH)}</h2><p>${esc(r.check2)}</p><p>${esc(r.check4)}</p></section>
    ${nav(true, r.next)}`;
  },
  function reflect() {
    const l = L(), f = l.f;
    return `<div class="stack"><h1>${esc(f.h)}</h1><p class="lede">${esc(f.p)}</p></div>
    ${f.items.map((q, i) => `<section class="card"><label class="field" for="ref-${i}"><span style="font-size:16px;font-weight:700">${i + 1}. ${esc(q)}</span><textarea id="ref-${i}" data-kind="reflect" data-i="${i}">${esc(S.reflect[i])}</textarea></label></section>`).join('')}
    <section class="card"><label class="field" for="notes"><span style="font-size:16px;font-weight:700">${esc(f.notes)}</span><textarea id="notes" data-kind="notes">${esc(S.notes)}</textarea></label></section>
    ${nav(true, f.next)}`;
  },
  function save() {
    const s = L().s;
    return `<div class="stack"><h1>${esc(s.h)}</h1></div>
    <section class="card"><h2>${esc(s.autoH)}</h2><p>${esc(canStore ? s.autoP : s.autoOff)}</p></section>
    <section class="card"><h2>${esc(s.shareH)}</h2><p>${esc(s.shareP)}</p><div class="btnrow"><button type="button" class="btn primary" id="copy-summary">${esc(s.copySummary)}</button></div><p class="status" id="st-summary" role="status"></p><textarea id="summary-text" class="summary-out" readonly hidden></textarea></section>
    <section class="card"><h2>${esc(s.moveH)}</h2><p>${esc(s.moveP)}</p><div class="btnrow"><button type="button" class="btn" id="save-file" hidden>${esc(s.saveFile)}</button><button type="button" class="btn" id="copy-code">${esc(s.copyCode)}</button></div><p class="status" id="st-move" role="status"></p><textarea id="code-text" class="summary-out" readonly hidden></textarea></section>
    <section class="card"><h2>${esc(s.loadH)}</h2><div class="btnrow"><label class="btn filelabel" for="load-file">${esc(s.loadFile)}<input type="file" id="load-file" accept=".json,application/json,text/plain"></label></div>
      <label class="field" for="paste-code">${esc(s.pasteL)}<textarea id="paste-code" style="min-height:80px"></textarea></label><div class="btnrow"><button type="button" class="btn" id="restore">${esc(s.restore)}</button></div><p class="status" id="st-load" role="status"></p></section>
    <section class="card"><h2>${esc(s.resetH)}</h2><p class="lede">${esc(s.resetP)}</p><div class="btnrow" id="reset-row"><button type="button" class="btn danger" id="reset">${esc(s.resetBtn)}</button></div>
      <div class="confirm" id="reset-confirm" hidden><p>${esc(s.resetQ)}</p><div class="btnrow"><button type="button" class="btn danger" id="reset-yes">${esc(s.resetYes)}</button><button type="button" class="btn" id="reset-no">${esc(s.cancel)}</button></div></div></section>
    ${nav(true, null)}`;
  }
];

let downloads = null;
function render(scrollTop) {
  document.getElementById('view').innerHTML = views[S.step]();
  paintMeta();
  if (S.step === 5) wireSave();
  if (scrollTop) window.scrollTo({ top: 0 });
}

function summaryText() {
  const l = L(), m = l.sum, out = [];
  out.push(m.title, '');
  out.push(`■ ${m.p1}`);
  l.q.items.forEach(([q, opts], i) => out.push(`${i + 1}. ${q}\n   → ${S.answers[i] !== null ? `${LETTERS[S.answers[i]]}) ${opts[S.answers[i]]}` : m.none}`));
  out.push('', `■ ${m.p2}`);
  l.t.tasks.forEach((t, i) => {
    const x = S.tasks[i];
    out.push(`${i + 1}. ${t.title} — ${m.ratings(x.enjoy ?? '-', x.ease ?? '-', x.more ? l.t[x.more] : '-')}`);
    if (x.text.trim()) out.push(`   ${m.work}: ${x.text.trim().replace(/\n/g, '\n   ')}`);
  });
  if (answeredQ() === 12 && ratedT() === 4) {
    const sc = scores();
    out.push('', `■ ${m.res}`, `${m.top}: ${l.roles[sc[0].role].name}`);
    sc.forEach(s => out.push(`   ${l.roles[s.role].name}: ${s.total}/20 (${s.q} + ${s.e} + ${s.b})`));
  }
  out.push('', `■ ${m.ref}`);
  l.f.items.forEach((q, i) => out.push(`${i + 1}. ${q}\n   → ${S.reflect[i].trim() || m.none}`));
  if (S.notes.trim()) out.push('', `■ ${m.notes}`, S.notes.trim());
  return out.join('\n');
}
const encode = () => btoa(unescape(encodeURIComponent(JSON.stringify(S))));
function decode(txt) {
  const t = txt.trim();
  if (!t) throw new Error('empty');
  if (t.startsWith('{')) return normalize(JSON.parse(t));
  return normalize(JSON.parse(decodeURIComponent(escape(atob(t)))));
}
async function copyText(text, statusEl, fallbackEl) {
  const s = L().s;
  try { await navigator.clipboard.writeText(text); statusEl.className = 'status'; statusEl.textContent = s.copied; }
  catch (e) { statusEl.className = 'status err'; statusEl.textContent = s.copyFail; fallbackEl.hidden = false; fallbackEl.value = text; fallbackEl.focus(); fallbackEl.select(); }
}
function restoreFrom(obj, statusEl) {
  const lang = S.lang;
  S = obj; S.lang = lang; S.step = 5;
  persist(); render(false);
  const st = document.getElementById('st-load'); st.className = 'status'; st.textContent = L().s.restored;
}
function wireSave() {
  const s = L().s;
  document.getElementById('copy-summary').addEventListener('click', () => copyText(summaryText(), document.getElementById('st-summary'), document.getElementById('summary-text')));
  document.getElementById('copy-code').addEventListener('click', () => copyText(encode(), document.getElementById('st-move'), document.getElementById('code-text')));
  const sf = document.getElementById('save-file');
  sf.hidden = false;
  sf.addEventListener('click', async () => {
    const st = document.getElementById('st-move');
    try {
      const data = JSON.stringify(S, null, 2), filename = 'marketing-role-progress.json';
      if (downloads) await downloads.save({ filename, data });
      else {
        const url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
        const a = document.createElement('a'); a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }
      st.className = 'status'; st.textContent = s.savedFile;
    } catch (e) {
      st.className = 'status err';
      st.textContent = e && e.code === 'declined' ? s.declined : s.saveFail;
    }
  });
  document.getElementById('load-file').addEventListener('change', ev => {
    const file = ev.target.files && ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { try { restoreFrom(decode(String(reader.result))); } catch (e) { const st = document.getElementById('st-load'); st.className = 'status err'; st.textContent = s.bad; } };
    reader.readAsText(file);
  });
  document.getElementById('restore').addEventListener('click', () => {
    try { restoreFrom(decode(document.getElementById('paste-code').value)); }
    catch (e) { const st = document.getElementById('st-load'); st.className = 'status err'; st.textContent = s.bad; }
  });
  document.getElementById('reset').addEventListener('click', () => { document.getElementById('reset-confirm').hidden = false; document.getElementById('reset-row').hidden = true; });
  document.getElementById('reset-no').addEventListener('click', () => { document.getElementById('reset-confirm').hidden = true; document.getElementById('reset-row').hidden = false; });
  document.getElementById('reset-yes').addEventListener('click', () => { S = fresh(S.lang); persist(); render(true); });
}

document.addEventListener('click', ev => {
  const go = ev.target.closest('[data-go]');
  if (go) { S.step = Number(go.dataset.go); persist(); render(true); return; }
  const tab = ev.target.closest('#tabs [data-step]');
  if (tab) { S.step = Number(tab.dataset.step); persist(); render(true); return; }
  const lang = ev.target.closest('.lang [data-lang]');
  if (lang && lang.dataset.lang !== S.lang) { S.lang = lang.dataset.lang; try { localStorage.setItem('mcg:lang', S.lang); } catch (e) {} persist(); render(false); }
});
document.getElementById('view').addEventListener('change', ev => {
  const el = ev.target, k = el.dataset.kind, i = Number(el.dataset.i);
  if (k === 'answer') { S.answers[i] = Number(el.value); document.getElementById('card-q' + i).classList.add('answered'); }
  else if (k === 'enjoy' || k === 'ease') S.tasks[i][k] = Number(el.value);
  else if (k === 'more') S.tasks[i].more = el.value;
  else return;
  persist(); paintMeta();
});
document.getElementById('view').addEventListener('input', ev => {
  const el = ev.target, k = el.dataset.kind, i = Number(el.dataset.i);
  if (k === 'text') S.tasks[i].text = el.value;
  else if (k === 'reflect') S.reflect[i] = el.value;
  else if (k === 'notes') S.notes = el.value;
  else return;
  persist(); paintMeta();
});

function boot(data) {
  if (data && data.state) { try { S = normalize(data.state); } catch (e) {} }
  render(false);
  if (window.claude && window.claude.use) {
    window.claude.use('downloads').then(d => { downloads = d; }).catch(() => {});
  }
}
window.claude?.hot?.snapshot?.(() => ({ state: S }));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
